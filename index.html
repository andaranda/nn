<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Paintings by Nancy Nguyen.">
  <meta name="theme-color" content="#ffffff">
  <title>Nancy Nguyen</title>
  <link rel="stylesheet" href="https://unpkg.com/pageable@0.6.6/dist/pageable.min.css">
  <link rel="stylesheet" href="assets/css/style.css?v=details-2">
  <script src="https://unpkg.com/pageable@0.6.6/dist/pageable.min.js" defer></script>
  <script src="assets/js/site.js?v=details-2" defer></script>
</head>
<body class="prayer-wheel">
  <header class="site-header">
    <a class="site-name" href="#wheel-track" aria-label="Nancy Nguyen, return to first painting">Nancy Nguyen</a>
    <div class="mantra-transition" aria-hidden="true"><span>oṃ tāre tuttāre ture svāhā</span></div>
  </header>

  <main>

    <div id="wheel-track" class="wheel-track" aria-label="Paintings">
      <section id="wheel-start" class="wheel-card wheel-loading" data-anchor="artwork-1" aria-label="Paintings">
        <p class="empty-state">Paintings will appear here when added to <code>data/artworks.json</code>.</p>
      </section>
      <section id="contact" class="contact-card" data-anchor="contact" aria-label="Contact">
        <a class="instagram-link" data-instagram-link href="https://www.instagram.com/oaht.n/" target="_blank" rel="noreferrer" aria-label="Nancy Nguyen on Instagram">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="4.1" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="17.7" cy="6.5" r="1.1" fill="currentColor"/></svg>
        </a>
        <a class="instagram-arrow" data-instagram-link href="https://www.instagram.com/oaht.n/" target="_blank" rel="noreferrer" aria-label="Open Nancy Nguyen on Instagram">↗</a>
      </section>
    </div>
  </main>

  <dialog id="artwork-dialog" class="artwork-dialog" aria-label="Artwork details">
    <button class="dialog-close" type="button" aria-label="Close artwork details">Close <span aria-hidden="true">×</span></button>
    <div id="dialog-content"></div>
  </dialog>
</body>
</html>
