<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Paintings by Nancy Nguyen.">
  <meta name="theme-color" content="#ffffff">
  <title>Nancy Nguyen</title>
  <link rel="stylesheet" href="assets/css/style.css?v=loop-3">
  <script src="assets/js/site.js?v=loop-3" defer></script>
</head>
<body class="prayer-wheel">
  <header class="site-header">
    <a class="site-name" href="#top" aria-label="Nancy Nguyen, return to beginning">Nancy Nguyen</a>
  </header>

  <main>
    <section id="top" class="hero" aria-label="Enter">
      <div id="home-artwork" class="hero-artwork">
        <p class="empty-state">Choose a featured painting in <code>data/site-config.json</code>.</p>
      </div>
      <a class="hero-scroll" href="#wheel-start" aria-label="Continue"><span></span></a>
    </section>

    <div class="mantra-transition" aria-hidden="true"><span>oṃ tāre tuttāre ture svāhā</span></div>

    <div id="wheel-track" class="wheel-track" aria-label="Paintings">
      <section id="wheel-start" class="wheel-card wheel-loading" aria-label="Paintings">
        <p class="empty-state">Paintings will appear here when added to <code>data/artworks.json</code>.</p>
      </section>
    </div>

    <section id="contact" class="contact-card" aria-label="Contact">
      <span>contact</span>
      <a data-instagram-link href="https://www.instagram.com/oaht.n/" target="_blank" rel="noreferrer" aria-label="Contact Nancy Nguyen on Instagram">↗</a>
    </section>

    <section id="return-loop" class="return-loop" aria-label="Return">
      <div class="return-circle" aria-hidden="true">
        <img id="return-image" alt="">
      </div>
      <span class="return-mantra" aria-hidden="true">oṃ tāre tuttāre ture svāhā</span>
    </section>
  </main>

  <dialog id="artwork-dialog" class="artwork-dialog" aria-label="Artwork details">
    <button class="dialog-close" type="button" aria-label="Close artwork details">Close <span aria-hidden="true">×</span></button>
    <div id="dialog-content"></div>
  </dialog>
</body>
</html>
